<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThekedarPro - Dynamic Wage & Expense Manager</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase Web SDK (v9 Compatibility) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b1120;
      color: #f8fafc;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #1e293b;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #3b82f6;
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between custom-scrollbar">

  <!-- Header Navigation -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between flex-wrap gap-3">
      <div class="flex items-center space-x-3">
        <div class="bg-amber-500 p-2.5 rounded-xl text-slate-950 font-black text-xl shadow-md">
          <i class="fa-solid fa-helmet-safety"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-white leading-tight flex items-center gap-2">
            ThekedarPro
            <span id="syncBadge" class="text-xs px-2 py-0.5 rounded-full font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
              <i class="fa-solid fa-cloud-check mr-1"></i> Cloud Synced
            </span>
          </h1>
          <p class="text-xs text-slate-400">Dynamic Wage & Site Expense Manager</p>
        </div>
      </div>

      <!-- Controls -->
      <div class="flex items-center space-x-3 text-sm">
        <!-- Site Selector -->
        <div class="relative">
          <select id="siteSelect" onchange="app.changeSite(this.value)" class="bg-slate-800 border border-slate-700 text-amber-400 font-semibold py-1.5 px-3 rounded-lg focus:outline-none focus:border-amber-500 cursor-pointer">
            <!-- Dynamic Sites -->
          </select>
          <button onclick="app.openModal('addSiteModal')" title="Add New Construction Site" class="ml-1 bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-700 px-2.5 py-1.5 rounded-lg transition">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>

        <!-- Connection Status -->
        <span id="connectionStatus" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Online
        </span>

        <!-- User Profile / Logout -->
        <div id="userMenu" class="hidden items-center gap-2 border-l border-slate-800 pl-3">
          <span id="userDisplay" class="text-xs font-medium text-slate-300"></span>
          <button onclick="app.logout()" class="text-slate-400 hover:text-red-400 p-2 rounded-lg bg-slate-800 border border-slate-700 transition" title="Logout">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <nav class="bg-slate-950/60 border-t border-slate-800/80 px-4">
      <div class="max-w-7xl mx-auto flex overflow-x-auto space-x-2 py-2 text-sm no-scrollbar">
        <button onclick="app.switchTab('workers')" id="tab-workers" class="px-4 py-2 rounded-lg font-medium transition whitespace-nowrap bg-amber-500 text-slate-950 font-bold">
          <i class="fa-solid fa-users mr-1.5"></i> Workers
        </button>
        <button onclick="app.switchTab('attendance')" id="tab-attendance" class="px-4 py-2 rounded-lg font-medium transition text-slate-400 hover:text-white whitespace-nowrap">
          <i class="fa-solid fa-calendar-days mr-1.5"></i> Attendance Calendar
        </button>
        <button onclick="app.switchTab('payouts')" id="tab-payouts" class="px-4 py-2 rounded-lg font-medium transition text-slate-400 hover:text-white whitespace-nowrap">
          <i class="fa-solid fa-wallet mr-1.5"></i> Labour Payments (Khata)
        </button>
        <button onclick="app.switchTab('inflow')" id="tab-inflow" class="px-4 py-2 rounded-lg font-medium transition text-slate-400 hover:text-white whitespace-nowrap">
          <i class="fa-solid fa-hand-holding-dollar mr-1.5"></i> Client Inflow
        </button>
        <button onclick="app.switchTab('reports')" id="tab-reports" class="px-4 py-2 rounded-lg font-medium transition text-slate-400 hover:text-white whitespace-nowrap">
          <i class="fa-solid fa-chart-pie mr-1.5"></i> Reports & Summary
        </button>
      </div>
    </nav>
  </header>

  <!-- Auth Overlay Modal -->
  <div id="authModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-5">
      <div class="text-center space-y-2">
        <div class="inline-block p-3 rounded-2xl bg-amber-500/10 text-amber-400 border border-amber-500/20 text-2xl">
          <i class="fa-solid fa-helmet-safety"></i>
        </div>
        <h2 class="text-xl font-bold text-white">Sign In to ThekedarPro</h2>
        <p class="text-xs text-slate-400">Sync workers, attendance, & payouts securely in the cloud</p>
      </div>

      <form onsubmit="app.handleAuth(event)" class="space-y-4">
        <div>
          <label class="text-xs font-semibold text-slate-400 block mb-1">Email Address</label>
          <input type="email" id="authEmail" required placeholder="contractor@example.com" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-400 block mb-1">Password</label>
          <input type="password" id="authPassword" required placeholder="••••••••" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
        </div>

        <div id="authError" class="hidden text-xs text-red-400 bg-red-500/10 p-2.5 rounded-lg border border-red-500/20"></div>

        <div class="flex gap-2">
          <button type="submit" onclick="app.authMode='login'" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-lg transition">
            Sign In
          </button>
          <button type="submit" onclick="app.authMode='signup'" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2.5 rounded-lg border border-slate-700 transition">
            Register
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Main Content Body -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">
    <div id="tabContent">
      <!-- Dynamic Views Rendered Here -->
    </div>
  </main>

  <!-- Global Modals -->
  <!-- Add Worker Modal -->
  <div id="addWorkerModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-white text-lg"><i class="fa-solid fa-user-plus text-amber-400 mr-2"></i>Add New Worker</h3>
        <button onclick="app.closeModal('addWorkerModal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form onsubmit="app.saveWorker(event)" class="space-y-3">
        <div>
          <label class="text-xs font-semibold text-slate-400 block mb-1">Worker Name</label>
          <input type="text" id="workerName" required placeholder="e.g. Ramesh Kumar" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-400 block mb-1">Role / Skill</label>
          <select id="workerRole" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-amber-400 font-semibold focus:outline-none focus:border-amber-500">
            <option value="Mason / Mistry">Mason / Mistry</option>
            <option value="Helper">Helper</option>
            <option value="Electrician">Electrician</option>
            <option value="Plumber">Plumber</option>
            <option value="Carpenter">Carpenter</option>
            <option value="Painter">Painter</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-400 block mb-1">Default Daily Rate (₹)</label>
          <input type="number" id="workerRate" required min="1" step="any" placeholder="600" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
        </div>
        <div class="pt-2 flex justify-end gap-2">
          <button type="button" onclick="app.closeModal('addWorkerModal')" class="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 font-semibold hover:bg-slate-700">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-lg bg-amber-500 text-slate-950 font-bold hover:bg-amber-400">Save Worker</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Site Modal -->
  <div id="addSiteModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-white text-lg"><i class="fa-solid fa-building text-amber-400 mr-2"></i>Add Construction Site</h3>
        <button onclick="app.closeModal('addSiteModal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form onsubmit="app.saveSite(event)" class="space-y-3">
        <div>
          <label class="text-xs font-semibold text-slate-400 block mb-1">Site Name</label>
          <input type="text" id="siteNameInput" required placeholder="e.g. Sector 62 Villa" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
        </div>
        <div class="pt-2 flex justify-end gap-2">
          <button type="button" onclick="app.closeModal('addSiteModal')" class="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 font-semibold hover:bg-slate-700">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-lg bg-amber-500 text-slate-950 font-bold hover:bg-amber-400">Create Site</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-slate-950 border-t border-slate-800/80 py-3 text-center text-xs text-slate-500">
    ThekedarPro • Offline-First Contractor Management • Firebase Cloud Synced
  </footer>

  <script>
    // HARDCODED FIREBASE CONFIGURATION
    const firebaseConfig = {
      apiKey: "AIzaSyD0PKlTMYZCwiL45fhZxD1z6-ymHbrDEAY",
      authDomain: "contractor-4b526.firebaseapp.com",
      projectId: "contractor-4b526",
      storageBucket: "contractor-4b526.firebasestorage.app",
      messagingSenderId: "421030593627",
      appId: "1:421030593627:web:e228518339a946706a2b7e"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    class ThekedarApp {
      constructor() {
        this.currentTab = 'workers';
        this.currentSite = 'Main Site';
        this.sites = ['Main Site'];
        this.workers = [];
        this.attendance = []; // { id, workerId, date, status, payout, note, site }
        this.payouts = [];    // { id, workerId, amount, mode, note, date, site }
        this.inflows = [];    // { id, amount, mode, note, date, site }
        this.user = null;
        this.authMode = 'login';

        this.init();
      }

      init() {
        // Firebase Auth Listener
        auth.onAuthStateChanged((user) => {
          if (user) {
            this.user = user;
            document.getElementById('authModal').classList.add('hidden');
            document.getElementById('userMenu').classList.remove('hidden');
            document.getElementById('userMenu').classList.add('flex');
            document.getElementById('userDisplay').innerText = user.email;
            this.listenToCloudData();
          } else {
            this.user = null;
            document.getElementById('authModal').classList.remove('hidden');
            document.getElementById('userMenu').classList.add('hidden');
            this.loadLocalData();
          }
        });

        this.renderSiteSelector();
        this.switchTab('workers');
      }

      handleAuth(e) {
        e.preventDefault();
        const email = document.getElementById('authEmail').value;
        const pass = document.getElementById('authPassword').value;
        const errDiv = document.getElementById('authError');
        errDiv.classList.add('hidden');

        if (this.authMode === 'login') {
          auth.signInWithEmailAndPassword(email, pass).catch(err => {
            errDiv.innerText = err.message;
            errDiv.classList.remove('hidden');
          });
        } else {
          auth.createUserWithEmailAndPassword(email, pass).catch(err => {
            errDiv.innerText = err.message;
            errDiv.classList.remove('hidden');
          });
        }
      }

      logout() {
        auth.signOut();
      }

      listenToCloudData() {
        if (!this.user) return;

        // Listen to Workers
        db.collection('users').doc(this.user.uid).collection('workers')
          .onSnapshot(snapshot => {
            this.workers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            this.renderCurrentView();
          });

        // Listen to Attendance
        db.collection('users').doc(this.user.uid).collection('attendance')
          .onSnapshot(snapshot => {
            this.attendance = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            this.renderCurrentView();
          });

        // Listen to Payouts
        db.collection('users').doc(this.user.uid).collection('payouts')
          .onSnapshot(snapshot => {
            this.payouts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            this.renderCurrentView();
          });

        // Listen to Inflows
        db.collection('users').doc(this.user.uid).collection('inflows')
          .onSnapshot(snapshot => {
            this.inflows = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            this.renderCurrentView();
          });
      }

      loadLocalData() {
        this.workers = JSON.parse(localStorage.getItem('tp_workers') || '[]');
        this.attendance = JSON.parse(localStorage.getItem('tp_attendance') || '[]');
        this.payouts = JSON.parse(localStorage.getItem('tp_payouts') || '[]');
        this.inflows = JSON.parse(localStorage.getItem('tp_inflows') || '[]');
        this.renderCurrentView();
      }

      saveLocalData() {
        localStorage.setItem('tp_workers', JSON.stringify(this.workers));
        localStorage.setItem('tp_attendance', JSON.stringify(this.attendance));
        localStorage.setItem('tp_payouts', JSON.stringify(this.payouts));
        localStorage.setItem('tp_inflows', JSON.stringify(this.inflows));
      }

      switchTab(tab) {
        this.currentTab = tab;
        ['workers', 'attendance', 'payouts', 'inflow', 'reports'].forEach(t => {
          const btn = document.getElementById(`tab-${t}`);
          if (btn) {
            if (t === tab) {
              btn.className = "px-4 py-2 rounded-lg font-medium transition whitespace-nowrap bg-amber-500 text-slate-950 font-bold";
            } else {
              btn.className = "px-4 py-2 rounded-lg font-medium transition text-slate-400 hover:text-white whitespace-nowrap";
            }
          }
        });
        this.renderCurrentView();
      }

      changeSite(site) {
        this.currentSite = site;
        this.renderCurrentView();
      }

      renderSiteSelector() {
        const sel = document.getElementById('siteSelect');
        if (!sel) return;
        sel.innerHTML = this.sites.map(s => `<option value="${s}" ${s === this.currentSite ? 'selected' : ''}>Site: ${s}</option>`).join('');
      }

      saveSite(e) {
        e.preventDefault();
        const input = document.getElementById('siteNameInput');
        if (input.value && !this.sites.includes(input.value)) {
          this.sites.push(input.value);
          this.currentSite = input.value;
          this.renderSiteSelector();
          input.value = '';
          this.closeModal('addSiteModal');
          this.renderCurrentView();
        }
      }

      renderCurrentView() {
        const container = document.getElementById('tabContent');
        if (!container) return;

        if (this.currentTab === 'workers') {
          this.renderWorkersView(container);
        } else if (this.currentTab === 'attendance') {
          this.renderAttendanceView(container);
        } else if (this.currentTab === 'payouts') {
          this.renderPayoutsView(container);
        } else if (this.currentTab === 'inflow') {
          this.renderInflowView(container);
        } else if (this.currentTab === 'reports') {
          this.renderReportsView(container);
        }
      }

      // WORKERS VIEW
      renderWorkersView(container) {
        const siteWorkers = this.workers.filter(w => !w.site || w.site === this.currentSite);
        
        let html = `
          <div class="space-y-4">
            <div class="flex justify-between items-center bg-slate-900/80 p-4 rounded-xl border border-slate-800">
              <div>
                <h2 class="text-lg font-bold text-white">Worker Directory</h2>
                <p class="text-xs text-slate-400">Manage daily wages and skilled roles for ${this.currentSite}</p>
              </div>
              <button onclick="app.openModal('addWorkerModal')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm shadow-md transition">
                <i class="fa-solid fa-user-plus mr-1.5"></i> Add New Worker
              </button>
            </div>
        `;

        if (siteWorkers.length === 0) {
          html += `
            <div class="text-center py-12 bg-slate-900/40 rounded-xl border border-slate-800/60">
              <i class="fa-solid fa-users text-4xl text-slate-600 mb-3"></i>
              <p class="text-slate-400 font-medium">No workers added for ${this.currentSite}</p>
              <button onclick="app.openModal('addWorkerModal')" class="mt-3 text-amber-400 text-sm font-semibold hover:underline">+ Add First Worker</button>
            </div>
          `;
        } else {
          html += `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">`;
          siteWorkers.forEach(w => {
            html += `
              <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3 relative hover:border-slate-700 transition">
                <div class="flex justify-between items-start">
                  <div>
                    <h3 class="font-bold text-white text-base">${w.name}</h3>
                    <span class="inline-block mt-1 px-2 py-0.5 rounded text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20">
                      ${w.role || 'Helper'}
                    </span>
                  </div>
                  <button onclick="app.deleteWorker('${w.id}')" class="text-slate-500 hover:text-red-400 p-1"><i class="fa-solid fa-trash text-sm"></i></button>
                </div>
                <div class="pt-2 border-t border-slate-800/80 flex justify-between items-center text-xs">
                  <span class="text-slate-400">Default Rate:</span>
                  <span class="text-amber-400 font-bold text-sm">₹${w.rate || 0}/day</span>
                </div>
              </div>
            `;
          });
          html += `</div>`;
        }
        html += `</div>`;
        container.innerHTML = html;
      }

      saveWorker(e) {
        e.preventDefault();
        const name = document.getElementById('workerName').value;
        const role = document.getElementById('workerRole').value;
        const rate = parseFloat(document.getElementById('workerRate').value);

        const workerData = { name, role, rate, site: this.currentSite };

        if (this.user) {
          db.collection('users').doc(this.user.uid).collection('workers').add(workerData);
        } else {
          this.workers.push({ id: Date.now().toString(), ...workerData });
          this.saveLocalData();
          this.renderCurrentView();
        }

        document.getElementById('workerName').value = '';
        this.closeModal('addWorkerModal');
      }

      deleteWorker(id) {
        if (!confirm('Are you sure you want to delete this worker?')) return;
        if (this.user) {
          db.collection('users').doc(this.user.uid).collection('workers').doc(id).delete();
        } else {
          this.workers = this.workers.filter(w => w.id !== id);
          this.saveLocalData();
          this.renderCurrentView();
        }
      }

      // ATTENDANCE CALENDAR VIEW
      renderAttendanceView(container) {
        const siteWorkers = this.workers.filter(w => !w.site || w.site === this.currentSite);
        const today = new Date().toISOString().split('T')[0];

        let html = `
          <div class="space-y-4">
            <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800 flex justify-between items-center flex-wrap gap-3">
              <div>
                <h2 class="text-lg font-bold text-white">Daily Attendance & Variable Wage Entry</h2>
                <p class="text-xs text-slate-400">Mark daily attendance and custom wage payout per worker</p>
              </div>
            </div>
        `;

        if (siteWorkers.length === 0) {
          html += `<div class="text-center py-8 text-slate-400">Please add workers first.</div>`;
        } else {
          html += `<div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg">
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm text-slate-300">
                <thead class="bg-slate-950 text-slate-400 uppercase text-xs">
                  <tr>
                    <th class="p-3.5">Worker</th>
                    <th class="p-3.5">Role</th>
                    <th class="p-3.5">Status Today</th>
                    <th class="p-3.5">Today Payout (₹)</th>
                    <th class="p-3.5">Note</th>
                    <th class="p-3.5">Action</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/80">`;

          siteWorkers.forEach(w => {
            const att = this.attendance.find(a => a.workerId === w.id && a.date === today) || {};
            html += `
              <tr class="hover:bg-slate-800/40">
                <td class="p-3.5 font-bold text-white">${w.name}</td>
                <td class="p-3.5"><span class="text-xs text-amber-400">${w.role}</span></td>
                <td class="p-3.5">
                  <select id="att-status-${w.id}" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-white">
                    <option value="Present" ${att.status === 'Present' ? 'selected' : ''}>Full Day</option>
                    <option value="Half-Day" ${att.status === 'Half-Day' ? 'selected' : ''}>Half Day</option>
                    <option value="Absent" ${att.status === 'Absent' ? 'selected' : ''}>Absent</option>
                  </select>
                </td>
                <td class="p-3.5">
                  <input type="number" id="att-payout-${w.id}" value="${att.payout !== undefined ? att.payout : w.rate}" step="any" min="0" class="w-24 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-amber-400 font-bold">
                </td>
                <td class="p-3.5">
                  <input type="text" id="att-note-${w.id}" value="${att.note || ''}" placeholder="Remarks" class="w-32 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-300">
                </td>
                <td class="p-3.5">
                  <button onclick="app.saveAttendance('${w.id}')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3 py-1 rounded text-xs">
                    Save
                  </button>
                </td>
              </tr>
            `;
          });

          html += `</tbody></table></div></div>`;
        }

        html += `</div>`;
        container.innerHTML = html;
      }

      saveAttendance(workerId) {
        const today = new Date().toISOString().split('T')[0];
        const status = document.getElementById(`att-status-${workerId}`).value;
        const payout = parseFloat(document.getElementById(`att-payout-${workerId}`).value) || 0;
        const note = document.getElementById(`att-note-${workerId}`).value;

        const attData = {
          workerId,
          date: today,
          status,
          payout,
          note,
          site: this.currentSite
        };

        const existing = this.attendance.find(a => a.workerId === workerId && a.date === today);

        if (this.user) {
          if (existing && existing.id) {
            db.collection('users').doc(this.user.uid).collection('attendance').doc(existing.id).set(attData);
          } else {
            db.collection('users').doc(this.user.uid).collection('attendance').add(attData);
          }
        } else {
          if (existing) {
            Object.assign(existing, attData);
          } else {
            this.attendance.push({ id: Date.now().toString(), ...attData });
          }
          this.saveLocalData();
          this.renderCurrentView();
        }
      }

      // PAYOUTS VIEW
      renderPayoutsView(container) {
        const siteWorkers = this.workers.filter(w => !w.site || w.site === this.currentSite);
        const sitePayouts = this.payouts.filter(p => !p.site || p.site === this.currentSite);

        let html = `
          <div class="space-y-4">
            <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800 flex justify-between items-center">
              <div>
                <h2 class="text-lg font-bold text-white">Labour Advance & Wage Payout Log</h2>
                <p class="text-xs text-slate-400">Record cash / UPI payouts given to workers</p>
              </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
              <h3 class="font-bold text-amber-400 text-sm">Record New Payout</h3>
              <form onsubmit="app.savePayout(event)" class="grid grid-cols-1 md:grid-cols-5 gap-3 text-xs">
                <div>
                  <label class="block text-slate-400 mb-1">Select Worker</label>
                  <select id="payWorker" required class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-2 text-white">
                    ${siteWorkers.map(w => `<option value="${w.id}">${w.name}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="block text-slate-400 mb-1">Amount (₹)</label>
                  <input type="number" id="payAmount" required min="1" step="any" placeholder="1000" class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-2 text-white">
                </div>
                <div>
                  <label class="block text-slate-400 mb-1">Payment Mode</label>
                  <select id="payMode" class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-2 text-white">
                    <option value="Cash">Cash</option>
                    <option value="UPI">UPI / PhonePe</option>
                    <option value="Bank Transfer">Bank Transfer</option>
                  </select>
                </div>
                <div>
                  <label class="block text-slate-400 mb-1">Note / Remark</label>
                  <input type="text" id="payNote" placeholder="Festival Advance" class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-2 text-white">
                </div>
                <div class="flex items-end">
                  <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2 rounded">
                    Record Payout
                  </button>
                </div>
              </form>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
              <table class="w-full text-left text-xs text-slate-300">
                <thead class="bg-slate-950 text-slate-400 uppercase">
                  <tr>
                    <th class="p-3">Date</th>
                    <th class="p-3">Worker</th>
                    <th class="p-3">Amount</th>
                    <th class="p-3">Mode</th>
                    <th class="p-3">Note</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800">`;

        sitePayouts.forEach(p => {
          const w = this.workers.find(wk => wk.id === p.workerId) || { name: 'Unknown' };
          html += `
            <tr>
              <td class="p-3">${p.date}</td>
              <td class="p-3 font-bold text-white">${w.name}</td>
              <td class="p-3 font-bold text-amber-400">₹${p.amount}</td>
              <td class="p-3"><span class="px-2 py-0.5 rounded bg-slate-800 border border-slate-700">${p.mode}</span></td>
              <td class="p-3 text-slate-400">${p.note || '-'}</td>
            </tr>
          `;
        });

        html += `</tbody></table></div></div>`;
        container.innerHTML = html;
      }

      savePayout(e) {
        e.preventDefault();
        const workerId = document.getElementById('payWorker').value;
        const amount = parseFloat(document.getElementById('payAmount').value);
        const mode = document.getElementById('payMode').value;
        const note = document.getElementById('payNote').value;
        const date = new Date().toISOString().split('T')[0];

        const payData = { workerId, amount, mode, note, date, site: this.currentSite };

        if (this.user) {
          db.collection('users').doc(this.user.uid).collection('payouts').add(payData);
        } else {
          this.payouts.push({ id: Date.now().toString(), ...payData });
          this.saveLocalData();
          this.renderCurrentView();
        }

        document.getElementById('payAmount').value = '';
        document.getElementById('payNote').value = '';
      }

      // CLIENT INFLOW VIEW
      renderInflowView(container) {
        const siteInflows = this.inflows.filter(i => !i.site || i.site === this.currentSite);

        let html = `
          <div class="space-y-4">
            <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800 flex justify-between items-center">
              <div>
                <h2 class="text-lg font-bold text-white">Client Payment Receipts</h2>
                <p class="text-xs text-slate-400">Track incoming payments from main contractor / owner</p>
              </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
              <h3 class="font-bold text-emerald-400 text-sm">Record Incoming Payment</h3>
              <form onsubmit="app.saveInflow(event)" class="grid grid-cols-1 md:grid-cols-4 gap-3 text-xs">
                <div>
                  <label class="block text-slate-400 mb-1">Amount Received (₹)</label>
                  <input type="number" id="recAmount" required min="1" step="any" placeholder="50000" class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-2 text-white">
                </div>
                <div>
                  <label class="block text-slate-400 mb-1">Payment Mode</label>
                  <select id="recMode" class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-2 text-white">
                    <option value="Bank Transfer">Bank Transfer</option>
                    <option value="UPI">UPI</option>
                    <option value="Cash">Cash</option>
                  </select>
                </div>
                <div>
                  <label class="block text-slate-400 mb-1">Note / Stage</label>
                  <input type="text" id="recNote" placeholder="Slab Completion" class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-2 text-white">
                </div>
                <div class="flex items-end">
                  <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2 rounded">
                    Record Receipt
                  </button>
                </div>
              </form>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
              <table class="w-full text-left text-xs text-slate-300">
                <thead class="bg-slate-950 text-slate-400 uppercase">
                  <tr>
                    <th class="p-3">Date</th>
                    <th class="p-3">Amount</th>
                    <th class="p-3">Mode</th>
                    <th class="p-3">Note</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800">`;

        siteInflows.forEach(i => {
          html += `
            <tr>
              <td class="p-3">${i.date}</td>
              <td class="p-3 font-bold text-emerald-400">₹${i.amount}</td>
              <td class="p-3"><span class="px-2 py-0.5 rounded bg-slate-800 border border-slate-700">${i.mode}</span></td>
              <td class="p-3 text-slate-400">${i.note || '-'}</td>
            </tr>
          `;
        });

        html += `</tbody></table></div></div>`;
        container.innerHTML = html;
      }

      saveInflow(e) {
        e.preventDefault();
        const amount = parseFloat(document.getElementById('recAmount').value);
        const mode = document.getElementById('recMode').value;
        const note = document.getElementById('recNote').value;
        const date = new Date().toISOString().split('T')[0];

        const inflowData = { amount, mode, note, date, site: this.currentSite };

        if (this.user) {
          db.collection('users').doc(this.user.uid).collection('inflows').add(inflowData);
        } else {
          this.inflows.push({ id: Date.now().toString(), ...inflowData });
          this.saveLocalData();
          this.renderCurrentView();
        }

        document.getElementById('recAmount').value = '';
        document.getElementById('recNote').value = '';
      }

      // REPORTS VIEW
      renderReportsView(container) {
        const siteWorkers = this.workers.filter(w => !w.site || w.site === this.currentSite);
        const sitePayouts = this.payouts.filter(p => !p.site || p.site === this.currentSite);
        const siteInflows = this.inflows.filter(i => !i.site || i.site === this.currentSite);
        const siteAttendance = this.attendance.filter(a => !a.site || a.site === this.currentSite);

        const totalGiven = sitePayouts.reduce((sum, p) => sum + (p.amount || 0), 0) + siteAttendance.reduce((sum, a) => sum + (a.payout || 0), 0);
        const totalInflow = siteInflows.reduce((sum, i) => sum + (i.amount || 0), 0);

        let html = `
          <div class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <span class="text-xs text-slate-400 uppercase font-semibold">Total Client Inflow</span>
                <p class="text-2xl font-bold text-emerald-400 mt-1">₹${totalInflow.toLocaleString()}</p>
              </div>
              <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <span class="text-xs text-slate-400 uppercase font-semibold">Total Money Given to Labour</span>
                <p class="text-2xl font-bold text-amber-400 mt-1">₹${totalGiven.toLocaleString()}</p>
              </div>
              <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <span class="text-xs text-slate-400 uppercase font-semibold">Net Cash Balance</span>
                <p class="text-2xl font-bold text-blue-400 mt-1">₹${(totalInflow - totalGiven).toLocaleString()}</p>
              </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
              <h3 class="font-bold text-white mb-3 text-sm">Labour Attendance & Payout Summary</h3>
              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-300">
                  <thead class="bg-slate-950 text-slate-400 uppercase">
                    <tr>
                      <th class="p-3">Worker Name</th>
                      <th class="p-3">Role / Skill</th>
                      <th class="p-3">Default Rate</th>
                      <th class="p-3">Present Days</th>
                      <th class="p-3">Half Days</th>
                      <th class="p-3">Total Earned</th>
                      <th class="p-3">Total Advances Given</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800">`;

        siteWorkers.forEach(w => {
          const wAtt = siteAttendance.filter(a => a.workerId === w.id);
          const presents = wAtt.filter(a => a.status === 'Present').length;
          const halfs = wAtt.filter(a => a.status === 'Half-Day').length;
          const earned = wAtt.reduce((sum, a) => sum + (a.payout || 0), 0);
          const advances = sitePayouts.filter(p => p.workerId === w.id).reduce((sum, p) => sum + (p.amount || 0), 0);

          html += `
            <tr>
              <td class="p-3 font-bold text-white">${w.name}</td>
              <td class="p-3"><span class="text-amber-400">${w.role}</span></td>
              <td class="p-3">₹${w.rate}</td>
              <td class="p-3">${presents}</td>
              <td class="p-3">${halfs}</td>
              <td class="p-3 font-bold text-emerald-400">₹${earned.toLocaleString()}</td>
              <td class="p-3 font-bold text-amber-400">₹${advances.toLocaleString()}</td>
            </tr>
          `;
        });

        html += `</tbody></table></div></div></div>`;
        container.innerHTML = html;
      }

      openModal(id) {
        document.getElementById(id).classList.remove('hidden');
      }

      closeModal(id) {
        document.getElementById(id).classList.add('hidden');
      }
    }

    const app = new ThekedarApp();
  </script>
</body>
</html>
